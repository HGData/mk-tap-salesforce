name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # Install the tap itself so the tests run against its declared dependencies
        # rather than a hand-listed subset. The old list omitted singer-python and
        # xmltodict, which every module outside credentials.py imports.
        run: pip install -e . pytest pytest-mock
      - name: Run tests
        run: pytest tests/test_credentials.py tests/test_row_filter.py -v
